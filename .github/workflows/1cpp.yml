name: RK U-Boot Build

on:
  push:
    branches: [ "next-dev" ]
  pull_request:
    branches: [ "next-dev" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Initialize and update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Clone rkbin
      run: |
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

    - name: Install Python2 and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python2 \
          swig \
          make \
          gcc \
          gcc-aarch64-linux-gnu \
          device-tree-compiler \
          bison \
          flex \
          libssl-dev \
          libssl1.1
        
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        sudo update-alternatives --set python /usr/bin/python2

    - name: Install specific toolchain version
      run: |
        # 下载并安装 Rockchip 指定的工具链版本
        sudo mkdir -p /opt/gcc
        cd /opt/gcc
        sudo wget https://releases.linaro.org/components/toolchain/binaries/6.3-2017.05/aarch64-linux-gnu/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz
        sudo tar xf gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz
        sudo rm gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz
        
        # 创建必要的符号链接
        sudo ln -s /opt/gcc/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-6.3.1
        sudo ln -s /opt/gcc/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-objcopy /usr/bin/aarch64-linux-gnu-objcopy-6.3.1

    - name: Create expected prebuilts structure
      run: |
        # 创建脚本期望的目录结构
        mkdir -p prebuilts/gcc/linux-x86/aarch64
        ln -s /opt/gcc/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu prebuilts/gcc/linux-x86/aarch64/

    - name: Build U-Boot
      run: |
        cd uboot
        
        # 设置工具链环境变量
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        
        # 创建缺失的.config文件
        make rk3588_defconfig
        
        # 执行编译
        ./make.sh rk3588

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: u-boot-images
        path: |
          uboot/*.img
          uboot/*.bin
          uboot/*.itb
