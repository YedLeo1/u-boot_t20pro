name: RK U-Boot Build

on:
  push:
    branches: [ "next-dev" ]
  pull_request:
    branches: [ "next-dev" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Initialize and update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Clone rkbin
      run: |
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

    - name: Install Python2 and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python2 \
          swig \
          make \
          gcc \
          device-tree-compiler \
          bison \
          flex \
          libssl-dev \
          libssl1.1 \
          xxd
        
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        sudo update-alternatives --set python /usr/bin/python2

    - name: Clone Firefly prebuilts
      run: |
        mkdir -p prebuilts/gcc/linux-x86/aarch64
        git clone --depth 1 https://gitlab.com/firefly-linux/prebuilts.git prebuilts/gcc/linux-x86/aarch64/prebuilts
        
        # 创建符号链接到预期位置
        ln -s $(pwd)/prebuilts/gcc/linux-x86/aarch64/prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu \
              prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu

    - name: Add toolchain to PATH
      run: |
        echo "$(pwd)/prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH

    - name: Build U-Boot
      run: |
        cd uboot
        
        # 设置工具链环境变量
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        
        # 执行编译
        ./make.sh rk3588

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: u-boot-images
        path: |
          uboot/*.img
          uboot/*.bin
          uboot/*.itb
        if-no-files-found: error
