name: RK U-Boot Build114

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      MAKEFLAGS: -j4  # 启用4个并行编译任务
      # 可选：设置特定路径用于加速
      # UBOOT_OUT: ${{ github.workspace }}/build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Cache toolchain
      uses: actions/cache@v4
      id: toolchain-cache
      with:
        path: |
          prebuilts/gcc/linux-x86/aarch64
        key: ${{ runner.os }}-toolchain-v1
    
    - name: Cache rkbin
      uses: actions/cache@v4
      id: rkbin-cache
      with:
        path: |
          rkbin
        key: ${{ runner.os }}-rkbin-v1
    
    - name: Setup ccache
      uses: actions/cache@v4
      id: ccache-cache
      with:
        path: |
          .ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('make.sh') }}
    
    - name: Initialize and update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python2 \
          swig \
          make \
          gcc \
          device-tree-compiler \
          bison \
          flex \
          libssl-dev \
          libssl1.1 \
          xxd \
          wget \
          xz-utils \
          tree \
          ccache  # 添加ccache
        
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        sudo update-alternatives --set python /usr/bin/python2

    - name: Clone rkbin (if not cached)
      if: steps.rkbin-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git

    - name: Download toolchain (if not cached)
      if: steps.toolchain-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p prebuilts/gcc/linux-x86/aarch64
        cd prebuilts/gcc/linux-x86/aarch64
        wget -q https://releases.linaro.org/components/toolchain/binaries/6.3-2017.05/aarch64-linux-gnu/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz
        tar xf gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz
        rm gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz

    - name: Setup environment
      run: |
        echo "${{ github.workspace }}/prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH
        # 启用ccache，优先使用缓存的编译结果
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        # 可选：为大型构建设置tmpfs
        sudo mount -t tmpfs -o size=2G tmpfs /tmp

    - name: Build U-Boot (with ccache)
      run: |
        export CROSS_COMPILE="ccache aarch64-linux-gnu-"  # 添加ccache前缀
        export ARCH=arm64
        
        # 清除旧的object文件但保留配置（避免全量编译）
        make mrproper
        
        # 使用预先生成的配置（如果可用）
        if [ -f .config ]; then
          cp .config .config.bak
        fi
        
        ./make.sh rk3588
        
        # 保存配置用于下次构建
        test -f .config && cp .config .config.save

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: u-boot-images
        path: |
          uboot.img
          rk3588_spl_loader_v1.18.113.bin
        if-no-files-found: error
