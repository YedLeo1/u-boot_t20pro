name: test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # 修复点 1：使用绝对路径定义工作区变量
      WORKSPACE: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # 修复点 2：使用正确路径设置缓存
    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Initialize environment
      run: |
        # 修复点 3：使用绝对路径引用
        git submodule sync --recursive &
        git submodule update --init --recursive &
        
        # 在工作区内创建目录（避免上级路径）
        mkdir -p "${{ env.WORKSPACE }}/rkbin"
        git clone --depth 1 https://github.com/rockchip-linux/rkbin.git "${{ env.WORKSPACE }}/rkbin" &
        
        # 在工作区内创建工具链目录
        mkdir -p "${{ env.WORKSPACE }}/prebuilts/gcc/linux-x86/aarch64"
        wait

    # 修复点 4：使用绝对路径缓存
    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.WORKSPACE }}/prebuilts/gcc/linux-x86/aarch64
        key: toolchain-${{ runner.os }}-6.3.1
        restore-keys: |
          toolchain-${{ runner.os }}-

    - name: Download toolchain (if needed)
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        cd "${{ env.WORKSPACE }}/prebuilts/gcc/linux-x86/aarch64"
        wget -q https://releases.linaro.org/components/toolchain/binaries/6.3-2017.05/aarch64-linux-gnu/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz
        tar xf gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz
        rm gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu.tar.xz

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python2 \
          swig \
          make \
          gcc \
          device-tree-compiler \
          bison \
          flex \
          libssl-dev \
          xxd \
          wget \
          xz-utils \
          ccache
        
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        sudo update-alternatives --set python /usr/bin/python2
        
        sudo /usr/sbin/update-ccache-symlinks
        echo "/usr/lib/ccache" >> $GITHUB_PATH

    - name: Add toolchain to PATH
      run: |
        # 修复点 5：使用绝对路径引用工具链
        echo "${{ env.WORKSPACE }}/prebuilts/gcc/linux-x86/aarch64/gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH

    - name: Build U-Boot
      run: |
        
        ./make.sh rk3588
        
        ccache -s

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: u-boot-images
        path: |
          uboot.img
          rk3588_spl_loader_v1.18.113.bin
        if-no-files-found: error
